<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakerPortal | MAKERSPACE@UTHM</title>
  
  <!-- BROWSER TAB LOGO (FAVICON) -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      background: #0b0f19; 
      color: white; 
      font-family: sans-serif; 
      min-height: 100vh;
      display: flex; 
      flex-direction: column;
    }

    /* NEW BRANDING HEADER */
    header { 
      height: 70px; 
      background: #111827; 
      padding: 0 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 2px solid #2563eb; 
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .logo-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #f3f4f6;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand-tagline {
      font-size: 0.75rem;
      color: #9ca3af;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    .brand-attribution {
      font-size: 0.7rem;
      font-weight: bold;
      color: #6b7280;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .brand-title { font-size: 1.2rem; }
      .brand-tagline { font-size: 0.65rem; }
      .brand-attribution { display: none; }
    }

    /* MAIN CONTAINER */
    main {
      padding: 2rem;
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    .hero-text {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .hero-text h2 { font-size: 2rem; margin: 0 0 10px 0; color: #fff; }
    .hero-text p { color: #9ca3af; margin: 0; }

    /* PORTAL LOADING ANIMATION */
    #loader {
      text-align: center;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .portal-animation {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .portal-ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed #2563eb;
      border-radius: 50%;
      animation: spinOuter 6s linear infinite, pulseGlow 2s ease-in-out infinite alternate;
    }

    .portal-ring-inner {
      position: absolute;
      width: 70%;
      height: 70%;
      border: 3px solid rgba(217, 37, 37, 0.6);
      border-top-color: #d92525;
      border-bottom-color: #d92525;
      border-radius: 50%;
      animation: spinInner 2s linear infinite;
    }

    .portal-core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: #2563eb;
      border-radius: 50%;
      box-shadow: 0 0 20px #2563eb, 0 0 40px #d92525;
      animation: corePulse 1.5s ease-in-out infinite alternate;
    }

    .portal-text {
      color: #60a5fa;
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: textBlink 1.5s linear infinite;
    }

    @keyframes spinOuter {
      0% { transform: rotate(0deg) scale(0.8); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.8); }
    }
    
    @keyframes spinInner {
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px #2563eb, inset 0 0 10px #2563eb; }
      100% { box-shadow: 0 0 25px rgba(37, 99, 235, 0.8), inset 0 0 20px rgba(37, 99, 235, 0.8); }
    }

    @keyframes corePulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* CATALOG GRID */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* PROJECT CARDS */
    .project-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: #d92525;
    }
    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #111827;
      border-bottom: 1px solid #374151;
    }
    .card-content {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-content h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #f9fafb;
    }
    .card-btn {
      background: #2563eb;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="brand-title">Maker<span style="color: #d92525;">Portal</span></div>
      <div class="brand-tagline">Bridging bytes and build</div>
    </div>
    <div class="brand-attribution">by MAKERSPACE@UTHM</div>
  </header>

  <main>
    <div class="hero-text">
      <h2>Select Your Project</h2>
      <p>Your gateway from digital blueprints to physical builds.</p>
    </div>

    <div id="loader">
      <div class="portal-animation">
        <div class="portal-ring-outer"></div>
        <div class="portal-ring-inner"></div>
        <div class="portal-core"></div>
      </div>
      <div class="portal-text">Establishing Portal Link...</div>
    </div>

    <div class="catalog-grid" id="catalog-grid">
      <!-- Project cards will be injected here by JavaScript -->
    </div>
  </main>

  <script>
    // YOUR APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyHIpqSz3wZT984jtw-TwQaxZJMwJwIdmAQg9Jz3_0IkdjTBRYjbtxnHWCK84K_MIxUTQ/exec";

    async function fetchCatalog() {
      const grid = document.getElementById('catalog-grid');
      const loader = document.getElementById('loader');

      try {
        // 1. Fetch data from Google Drive via Apps Script
        const response = await fetch(API_URL);
        const projects = await response.json();

        // 2. Save the entire package to the browser's temporary memory
        sessionStorage.setItem('makerspace_projects', JSON.stringify(projects));

        // 3. Hide the loading spinner
        loader.style.display = 'none';

        // 4. Check if folders exist
        if (!projects || projects.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #9ca3af;">No projects found in the Drive folder.</p>';
          return;
        }

        // 5. Generate the clickable cards
        projects.forEach((project, index) => {
          const card = document.createElement('a');
          card.href = `viewer.html?id=${index}`; 
          card.className = 'project-card';
          
          card.innerHTML = `
            <img src="${project.coverUrl}" alt="${project.title}" class="card-image" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
            <div class="card-content">
              <h3>${project.title}</h3>
              <span class="card-btn">Build ➔</span>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error("Error fetching catalog:", error);
        loader.innerHTML = '⚠️ Portal link failed. Check your Apps Script deployment and permissions.';
        loader.style.color = '#ef4444';
      }
    }

    window.onload = fetchCatalog;
  </script>
</body>
</html>
