<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakerPortal | MAKERSPACE@UTHM</title>
  
  <!-- BROWSER TAB LOGO (FAVICON) -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * { box-sizing: border-box; }
    
    /* THEME ADJUSTMENT: Pure black to seamlessly blend with makerportal.jpg */
    body { 
      margin: 0; 
      padding: 0; 
      background: #000000; 
      color: #ffffff; 
      font-family: sans-serif; 
      min-height: 100vh;
      display: flex; 
      flex-direction: column;
    }

    /* TOP ACCENT BAR (Using colors from the logo) */
    .top-accent {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #1a8cff, #00cc44, #ffcc00, #e60000);
      flex-shrink: 0;
    }

    /* MAIN CONTAINER */
    main {
      padding: 2rem 1.5rem;
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* HERO LOGO SECTION */
    .hero-container {
      text-align: center;
      margin-bottom: 2.5rem;
      width: 100%;
      max-width: 500px; /* Constrains the logo so it's not massive on big screens */
    }
    .hero-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* PORTAL LOADING ANIMATION */
    #loader {
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .portal-animation {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Adjusted rings to match logo colors (Bright Blue & Red) */
    .portal-ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed #1a8cff;
      border-radius: 50%;
      animation: spinOuter 6s linear infinite, pulseGlow 2s ease-in-out infinite alternate;
    }

    .portal-ring-inner {
      position: absolute;
      width: 70%;
      height: 70%;
      border: 3px solid rgba(230, 0, 0, 0.6);
      border-top-color: #e60000;
      border-bottom-color: #e60000;
      border-radius: 50%;
      animation: spinInner 2s linear infinite;
    }

    .portal-core {
      position: absolute;
      width: 30%;
      height: 30%;
      background: #1a8cff;
      border-radius: 50%;
      box-shadow: 0 0 20px #1a8cff, 0 0 40px #e60000;
      animation: corePulse 1.5s ease-in-out infinite alternate;
    }

    .portal-text {
      color: #1a8cff;
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: textBlink 1.5s linear infinite;
    }

    @keyframes spinOuter {
      0% { transform: rotate(0deg) scale(0.8); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.8); }
    }
    @keyframes spinInner { 100% { transform: rotate(-360deg); } }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px #1a8cff, inset 0 0 10px #1a8cff; }
      100% { box-shadow: 0 0 25px rgba(26, 140, 255, 0.8), inset 0 0 20px rgba(26, 140, 255, 0.8); }
    }
    @keyframes corePulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* CATALOG GRID */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    /* PROJECT CARDS */
    .project-card {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      border-color: #1a8cff; /* Logo Blue accent */
    }
    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #0a0a0a;
      border-bottom: 1px solid #333333;
    }
    .card-content {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-content h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #f9fafb;
    }
    .card-btn {
      background: #1a8cff; /* Logo Blue accent */
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* FOOTER */
    footer {
      background: #050505;
      border-top: 1px solid #1a1a1a;
      padding: 1.5rem 1rem;
      text-align: center;
      margin-top: auto; /* Pushes footer to the bottom */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .footer-text {
      color: #6b7280;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    
    .footer-logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .footer-makerspace-logo {
      height: 30px; /* Adjust size of UTHM logo as needed */
      width: auto;
      border-radius: 4px;
    }

    .footer-brand {
      color: #f3f4f6;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Minimal top gradient bar incorporating the logo's circuitry colors -->
  <div class="top-accent"></div>

  <main>
    <!-- HERO SECTION: Featuring the provided image -->
    <div class="hero-container">
      <img src="makerportal.jpg" alt="MakerPortal - Bridging bytes and build">
    </div>

    <div id="loader">
      <div class="portal-animation">
        <div class="portal-ring-outer"></div>
        <div class="portal-ring-inner"></div>
        <div class="portal-core"></div>
      </div>
      <div class="portal-text">Establishing Portal Link...</div>
    </div>

    <div class="catalog-grid" id="catalog-grid">
      <!-- Project cards will be injected here by JavaScript -->
    </div>
  </main>

  <!-- NEW FOOTER SECTION -->
  <footer>
    <div class="footer-text">Powered by</div>
    <div class="footer-logo-container">
      <!-- Assuming logo.png is your MAKERSPACE@UTHM logo -->
      <img src="logo.png" alt="MAKERSPACE Logo" class="footer-makerspace-logo" onerror="this.style.display='none'">
      <span class="footer-brand">MAKERSPACE@UTHM</span>
    </div>
  </footer>

  <script>
    // YOUR APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyHIpqSz3wZT984jtw-TwQaxZJMwJwIdmAQg9Jz3_0IkdjTBRYjbtxnHWCK84K_MIxUTQ/exec";

    async function fetchCatalog() {
      const grid = document.getElementById('catalog-grid');
      const loader = document.getElementById('loader');

      try {
        const response = await fetch(API_URL);
        const projects = await response.json();

        sessionStorage.setItem('makerspace_projects', JSON.stringify(projects));

        loader.style.display = 'none';

        if (!projects || projects.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #9ca3af;">No projects found in the Drive folder.</p>';
          return;
        }

        projects.forEach((project, index) => {
          const card = document.createElement('a');
          card.href = `viewer.html?id=${index}`; 
          card.className = 'project-card';
          
          card.innerHTML = `
            <img src="${project.coverUrl}" alt="${project.title}" class="card-image" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
            <div class="card-content">
              <h3>${project.title}</h3>
              <span class="card-btn">Build ➔</span>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error("Error fetching catalog:", error);
        loader.innerHTML = '⚠️ Portal link failed. Check your Apps Script deployment and permissions.';
        loader.style.color = '#e60000';
      }
    }

    window.onload = fetchCatalog;
  </script>
</body>
</html>
