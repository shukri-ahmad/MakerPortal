<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakerPortal | MAKERSPACE@UTHM</title>
  
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      padding: 0; 
      background: #000000; 
      color: #ffffff; 
      font-family: sans-serif; 
      min-height: 100vh;
      display: flex; 
      flex-direction: column;
    }

    .top-accent {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #1a8cff, #00cc44, #ffcc00, #e60000);
      flex-shrink: 0;
    }

    main {
      padding: 2rem 1.5rem;
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .hero-container {
      text-align: center;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 500px; 
    }
    .hero-container img { width: 100%; height: auto; display: block; margin: 0 auto; }

    /* REFRESH BUTTON */
    .refresh-container { margin-bottom: 2.5rem; text-align: center; }
    .btn-refresh {
      background: #111111;
      border: 1px solid #1a8cff;
      color: #1a8cff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-refresh:hover { background: #1a8cff; color: #ffffff; }
    .btn-refresh:disabled { background: #333; color: #777; border-color: #555; cursor: not-allowed; }

    /* LOADER ANIMATION */
    #loader { text-align: center; padding: 2rem; display: flex; flex-direction: column; align-items: center; width: 100%; }
    .portal-animation { position: relative; width: 80px; height: 80px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
    .portal-ring-outer { position: absolute; width: 100%; height: 100%; border: 3px dashed #1a8cff; border-radius: 50%; animation: spinOuter 6s linear infinite, pulseGlow 2s ease-in-out infinite alternate; }
    .portal-ring-inner { position: absolute; width: 70%; height: 70%; border: 3px solid rgba(230, 0, 0, 0.6); border-top-color: #e60000; border-bottom-color: #e60000; border-radius: 50%; animation: spinInner 2s linear infinite; }
    .portal-core { position: absolute; width: 30%; height: 30%; background: #1a8cff; border-radius: 50%; box-shadow: 0 0 20px #1a8cff, 0 0 40px #e60000; animation: corePulse 1.5s ease-in-out infinite alternate; }
    .portal-text { color: #1a8cff; font-family: monospace; font-size: 1rem; letter-spacing: 1.5px; text-transform: uppercase; animation: textBlink 1.5s linear infinite; }

    @keyframes spinOuter { 0% { transform: rotate(0deg) scale(0.8); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(0.8); } }
    @keyframes spinInner { 100% { transform: rotate(-360deg); } }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 10px #1a8cff, inset 0 0 10px #1a8cff; } 100% { box-shadow: 0 0 25px rgba(26, 140, 255, 0.8), inset 0 0 20px rgba(26, 140, 255, 0.8); } }
    @keyframes corePulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 1; } }
    @keyframes textBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* SECTION STYLES */
    .section-container { width: 100%; margin-bottom: 3rem; }
    .section-title {
      color: #f3f4f6;
      border-bottom: 2px solid #333333;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; }

    .project-card {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .project-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.6); border-color: #1a8cff; }
    .card-image { width: 100%; height: 180px; object-fit: cover; background: #0a0a0a; border-bottom: 1px solid #333333; }
    .card-content { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-content h3 { margin: 0; font-size: 1.1rem; color: #f9fafb; }
    
    .card-btn { background: #1a8cff; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    .btn-play { background: #e60000; } /* Special color for Game cards */

    footer {
      background: #050505; border-top: 1px solid #1a1a1a; padding: 1.5rem 1rem; text-align: center; margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .footer-text { color: #6b7280; font-size: 0.85rem; letter-spacing: 0.5px; }
    .footer-logo-container { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .footer-makerspace-logo { height: 30px; width: auto; border-radius: 4px; }
    .footer-brand { color: #f3f4f6; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="top-accent"></div>

  <main>
    <div class="hero-container">
      <img src="makerportal.jpg" alt="MakerPortal - Bridging bytes and build">
    </div>

    <!-- NEW REFRESH BUTTON -->
    <div class="refresh-container">
      <button id="refreshBtn" class="btn-refresh" onclick="fetchCatalog(true)">
        <span>🔄</span> Fetch New Modules
      </button>
    </div>

    <div id="loader">
      <div class="portal-animation">
        <div class="portal-ring-outer"></div>
        <div class="portal-ring-inner"></div>
        <div class="portal-core"></div>
      </div>
      <div class="portal-text" id="loader-text">Establishing Portal Link...</div>
    </div>

    <!-- BUILD HUB SECTION -->
    <div class="section-container" id="build-section" style="display: none;">
      <h2 class="section-title">⚙️ BUILD HUB</h2>
      <div class="catalog-grid" id="build-grid"></div>
    </div>

    <!-- GAME ARENA SECTION -->
    <div class="section-container" id="game-section" style="display: none;">
      <h2 class="section-title">🎮 GAME ARENA</h2>
      <div class="catalog-grid" id="game-grid"></div>
    </div>

  </main>

  <footer>
    <div class="footer-text">Powered by</div>
    <div class="footer-logo-container">
      <img src="logo.png" alt="MAKERSPACE Logo" class="footer-makerspace-logo" onerror="this.style.display='none'">
      <span class="footer-brand">MAKERSPACE@UTHM</span>
    </div>
  </footer>

  <script>
    const BASE_API_URL = "https://script.google.com/macros/s/AKfycbyHIpqSz3wZT984jtw-TwQaxZJMwJwIdmAQg9Jz3_0IkdjTBRYjbtxnHWCK84K_MIxUTQ/exec";

    // Now accepts a boolean to determine if we are forcing a refresh
    async function fetchCatalog(forceRefresh = false) {
      const buildGrid = document.getElementById('build-grid');
      const gameGrid = document.getElementById('game-grid');
      const loader = document.getElementById('loader');
      const loaderText = document.getElementById('loader-text');
      const refreshBtn = document.getElementById('refreshBtn');

      // If forcing refresh, reset the UI to loading state
      if (forceRefresh) {
        buildGrid.innerHTML = '';
        gameGrid.innerHTML = '';
        document.getElementById('build-section').style.display = 'none';
        document.getElementById('game-section').style.display = 'none';
        loader.style.display = 'flex';
        loaderText.innerText = 'Scanning Drive for new modules...';
        
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<span>⏳</span> Scanning...';
      }

      try {
        // Append ?refresh=true if the user clicked the button
        const fetchUrl = forceRefresh ? `${BASE_API_URL}?refresh=true` : BASE_API_URL;
        
        const response = await fetch(fetchUrl);
        const projects = await response.json();

        localStorage.setItem('makerspace_projects', JSON.stringify(projects));
        loader.style.display = 'none';
        
        // Reset refresh button
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<span>🔄</span> Fetch New Modules';

        if (!projects || projects.length === 0) {
          buildGrid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #9ca3af;">No projects found in the Drive folder.</p>';
          document.getElementById('build-section').style.display = 'block';
          return;
        }

        projects.forEach((project, index) => {
          let displayCover = project.coverUrl;
          if (!displayCover && project.tutorialImages && project.tutorialImages.length > 0) {
            displayCover = project.tutorialImages[0].url;
          }
          if (!displayCover) {
            displayCover = 'https://via.placeholder.com/400x300/111111/1a8cff?text=No+Preview';
          }

          let isGame = false;
          let displayTitle = project.title;
          
          if (displayTitle.toUpperCase().startsWith('[GAME]')) {
            isGame = true;
            displayTitle = displayTitle.substring(6).trim(); 
          }

          const card = document.createElement('a');
          card.href = `viewer.html?id=${index}`; 
          card.target = '_blank';
          card.className = 'project-card';
          
          card.innerHTML = `
            <img src="${displayCover}" alt="${displayTitle}" class="card-image" loading="lazy" 
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300/111111/1a8cff?text=No+Preview';">
            <div class="card-content">
              <h3>${displayTitle}</h3>
              <span class="card-btn ${isGame ? 'btn-play' : ''}">${isGame ? 'Play ➔' : 'Build ➔'}</span>
            </div>
          `;
          
          if (isGame) {
            gameGrid.appendChild(card);
            document.getElementById('game-section').style.display = 'block';
          } else {
            buildGrid.appendChild(card);
            document.getElementById('build-section').style.display = 'block';
          }
        });

      } catch (error) {
        console.error("Error fetching catalog:", error);
        loader.innerHTML = '⚠️ Portal link failed. Check your Apps Script deployment and permissions.';
        loader.style.color = '#e60000';
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<span>🔄</span> Retry Fetch';
      }
    }

    window.onload = () => fetchCatalog(false);
  </script>
</body>
</html>
