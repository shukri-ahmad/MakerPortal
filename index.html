<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKERSPACE@UTHM Catalog</title>
  
  <!-- BROWSER TAB LOGO (FAVICON) -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      background: #0b0f19; 
      color: white; 
      font-family: sans-serif; 
      min-height: 100vh;
      display: flex; 
      flex-direction: column;
    }

    /* HEADER */
    header { 
      height: 60px; 
      background: #111827; 
      padding: 0 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 2px solid #d92525; 
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.2rem; margin: 0; color: #f3f4f6; letter-spacing: 1px; }
    header span { color: #9ca3af; font-size: 0.85rem; font-weight: bold; }

    /* MAIN CONTAINER */
    main {
      padding: 2rem;
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    .hero-text {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .hero-text h2 { font-size: 2rem; margin: 0 0 10px 0; color: #fff; }
    .hero-text p { color: #9ca3af; margin: 0; }

    /* LOADING SPINNER */
    #loader {
      text-align: center;
      padding: 3rem;
      color: #60a5fa;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .spinner {
      display: inline-block;
      width: 40px; height: 40px;
      border: 4px solid rgba(96, 165, 250, 0.3);
      border-radius: 50%;
      border-top-color: #60a5fa;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* CATALOG GRID */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* PROJECT CARDS */
    .project-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: #d92525;
    }
    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #111827;
      border-bottom: 1px solid #374151;
    }
    .card-content {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-content h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #f9fafb;
    }
    .card-btn {
      background: #2563eb;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>MAKERSPACE<span style="color:#d92525;">@</span>UTHM</h1>
    <span>Project Hub</span>
  </header>

  <main>
    <div class="hero-text">
      <h2>Select Your Project</h2>
      <p>Choose a robot or module below to open the interactive workbench.</p>
    </div>

    <div id="loader">
      <div class="spinner"></div>
      <br>Syncing with Google Drive...
    </div>

    <div class="catalog-grid" id="catalog-grid">
      <!-- Project cards will be injected here by JavaScript -->
    </div>
  </main>

  <script>
    // YOUR APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyHIpqSz3wZT984jtw-TwQaxZJMwJwIdmAQg9Jz3_0IkdjTBRYjbtxnHWCK84K_MIxUTQ/exec";

    async function fetchCatalog() {
      const grid = document.getElementById('catalog-grid');
      const loader = document.getElementById('loader');

      try {
        // 1. Fetch data from Google Drive via Apps Script
        const response = await fetch(API_URL);
        const projects = await response.json();

        // 2. Save the entire package to the browser's temporary memory
        sessionStorage.setItem('makerspace_projects', JSON.stringify(projects));

        // 3. Hide the loading spinner
        loader.style.display = 'none';

        // 4. Check if folders exist
        if (!projects || projects.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #9ca3af;">No projects found in the Drive folder.</p>';
          return;
        }

        // 5. Generate the clickable cards
        projects.forEach((project, index) => {
          const card = document.createElement('a');
          card.href = `viewer.html?id=${index}`; // The critical handoff link
          card.className = 'project-card';
          
          card.innerHTML = `
            <img src="${project.coverUrl}" alt="${project.title}" class="card-image" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
            <div class="card-content">
              <h3>${project.title}</h3>
              <span class="card-btn">Build ➔</span>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error("Error fetching catalog:", error);
        loader.innerHTML = '⚠️ Error loading catalog. Check your Apps Script deployment and permissions.';
        loader.style.color = '#ef4444';
      }
    }

    // Run the fetch function as soon as the page loads
    window.onload = fetchCatalog;
  </script>
</body>
</html>
